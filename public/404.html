<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Page introuvable — Sama Yoon</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      :root { color-scheme: light; }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 16px; box-sizing: border-box;
        background: #f2e3c6; color: #3b2314; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; text-align: center; }
      main { max-width: 26rem; }
      img { width: 96px; height: 96px; }
      h1 { font-family: 'Segoe Print', 'Bradley Hand', cursive; color: #1f2f5c; font-size: 2.2rem; margin: 0.5rem 0; }
      p { line-height: 1.5; }
      a { display: inline-block; margin-top: 1rem; padding: 0.8rem 1.4rem; border-radius: 999px; background: #1f2f5c; color: #f2e3c6;
        font-weight: 700; text-decoration: none; }
      .wax { position: fixed; left: 0; right: 0; bottom: 0; height: 10px;
        background: repeating-linear-gradient(135deg, #1f2f5c 0 8px, #c8822b 8px 16px, #3f7a3a 16px 24px, #f2e3c6 24px 27px); }
    </style>
  </head>
  <body>
    <main>
      <img src="/favicon.svg" alt="" />
      <h1>Cette route n'existe pas</h1>
      <p>La page demandée est introuvable. Retrouvez la carte de fluidité de Dakar pendant les JOJ 2026.</p>
      <a href="/">Retour à la carte</a>
    </main>
    <div class="wax"></div>
  </body>
</html>
