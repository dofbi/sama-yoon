[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[build.environment]
  NODE_VERSION = "22"

# Hashed assets: cache forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Datasets: short cache so new versions reach users quickly (the service
# worker also revalidates them in the background).
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(self), camera=(), microphone=()"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

# One canonical host: the Netlify subdomain redirects to samayoon.app.
[[redirects]]
  from = "https://sama-yoon.netlify.app/*"
  to = "https://samayoon.app/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.samayoon.app/*"
  to = "https://samayoon.app/:splat"
  status = 301
  force = true

# The app is a single page (state lives in ?query), so unknown paths are real
# 404s (public/404.html) instead of a soft-404 copy of the home page.
