    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Sama Yoon",
        "alternateName": "Sama Yoon — La mobilité intelligente à Dakar",
        "url": "%SITE_URL%/",
        "image": "%SITE_URL%/icons/og.jpg",
        "description": "Carte de fluidité en temps réel pendant les Jeux Olympiques de la Jeunesse Dakar 2026 : axes à fort trafic, alternatives TER/BRT, info-trafic citoyenne et alertes push.",
        "applicationCategory": "TravelApplication",
        "operatingSystem": "Web, Android, iOS",
        "inLanguage": "fr",
        "isAccessibleForFree": true,
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "XOF" },
        "areaServed": [
          { "@type": "City", "name": "Dakar" },
          { "@type": "City", "name": "Diamniadio" },
          { "@type": "City", "name": "Saly" }
        ],
        "about": { "@type": "SportsEvent", "name": "Jeux Olympiques de la Jeunesse Dakar 2026", "startDate": "2026-10-31", "endDate": "2026-11-13", "location": { "@type": "Place", "name": "Dakar, Sénégal" } }
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://tile.openstreetmap.org" crossorigin />
    <link rel="preload" href="/data/events/jojdakar2026/venues.json" as="fetch" crossorigin />
    <link rel="preload" href="/data/events/jojdakar2026/events_schedule.json" as="fetch" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Caveat+Brush&display=swap&text=SamaYonDkr%C3%A9%C3%A8%C3%A0%C3%A7%27-%20abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789%C3%89%C5%92%C5%93%C3%B4%C3%AA%C3%BB%C3%AE%3A%2C.%21%3F" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat+Brush&display=swap&text=SamaYonDkr%C3%A9%C3%A8%C3%A0%C3%A7%27-%20abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789%C3%89%C5%92%C5%93%C3%B4%C3%AA%C3%BB%C3%AE%3A%2C.%21%3F" /></noscript>
    <link rel="stylesheet" href="/src/style.css" />
    <script>
      // Returning visitors: the info top bar stays collapsed (set before first paint).
      try {
        if (localStorage.getItem('samayoon.topbarSeen')) document.documentElement.classList.add('topbar-seen');
      } catch (e) {}
    </script>
  </head>
  <body class="parchment">
    <div id="app" class="flex h-dvh flex-col overflow-hidden">
      <!-- Header -->
      <header class="parchment relative z-[1000] shrink-0">
        <div class="mx-auto flex max-w-3xl items-center gap-3 px-4 pt-[max(0.5rem,env(safe-area-inset-top))] pb-2">
          <span id="logo" class="size-10 shrink-0"></span>
          <div class="min-w-0 flex-1 leading-tight">
            <h1 class="font-display text-[1.75rem] leading-none text-indigo">Sama Yoon</h1>
            <p class="truncate text-xs font-semibold text-terre" data-i18n="app.tagline"></p>
          </div>
          <span id="badge" class="hidden rounded-full bg-ocre px-2.5 py-1 text-xs font-bold text-white" title=""></span>
          <button id="btn-alerts" class="grid size-11 place-items-center rounded-full border-2 border-terre text-xl" aria-haspopup="dialog" aria-label="Mes alertes trafic">🔕</button>
          <button id="btn-menu" class="grid size-11 place-items-center rounded-full border-2 border-terre text-terre" aria-haspopup="dialog"></button>
        </div>
        <div class="wax-band"></div>
        <div id="topbar" class="bg-indigo text-sable" role="region" aria-live="polite">
          <div class="topbar-inner">
          <div class="mx-auto flex max-w-3xl items-center gap-2 px-4 py-2">
            <p id="topbar-text" class="min-w-0 flex-1 text-[13px] leading-snug font-semibold" data-i18n="topbar.rain"></p>
            <button id="topbar-action" class="shrink-0 rounded-full bg-ocre px-3 py-1.5 text-xs font-bold text-white" data-i18n="topbar.report"></button>
          </div>
          <div class="mx-auto flex max-w-3xl items-center gap-2 px-4 pb-2" role="group" aria-label="Mode d’information">
            <button class="mode-chip" data-mode="rain" aria-pressed="true" data-i18n="topbar.rainChip"></button>
            <button class="mode-chip" data-mode="joj" aria-pressed="false" data-i18n="topbar.jojChip"></button>
            <button id="btn-install" class="mode-chip ml-auto hidden" data-i18n="topbar.install"></button>
          </div>
          </div>
        </div>
        <nav class="mx-auto flex max-w-3xl items-center gap-2 overflow-x-auto px-4 py-2" aria-label="Période">
          <button class="chip" data-filter="now"></button>
          <button class="chip" data-filter="today"></button>
          <button class="chip" data-filter="tomorrow"></button>
          <label class="chip relative inline-flex items-center gap-1" data-filter-wrap="day">
            <span aria-hidden="true">📅</span>
            <select id="day-select" aria-label="Choisir un jour des Jeux" class="max-w-36 appearance-none bg-transparent pr-1 font-semibold outline-none"></select>
          </label>
        </nav>
      </header>

      <!-- Map -->
      <main class="map-frame relative min-h-0 flex-1">
        <div id="map" class="absolute inset-0" role="application" aria-label="Carte de fluidité de Dakar"></div>
        <p id="banner" class="map-overlay absolute top-3 left-3 right-16 z-[600] hidden rounded-2xl bg-indigo/95 px-4 py-2 text-center text-sm font-semibold text-sable shadow-lg" role="status"></p>
        <div class="map-overlay absolute bottom-6 left-3 z-[500] flex flex-col items-start gap-1.5">
          <nav id="zones" class="hidden flex-col gap-1 rounded-2xl border-2 border-terre bg-sable/95 p-1.5 shadow-md" aria-label="Aller à"></nav>
          <div class="flex items-center gap-1.5">
            <button id="btn-zones" class="rounded-full border-2 border-terre bg-sable/95 px-3 py-1.5 text-xs font-bold shadow-md" aria-expanded="false" aria-controls="zones">📍 Aller à…</button>
            <div id="legend" class="parchment flex gap-2 rounded-full border-2 border-terre px-2.5 py-1 text-[11px] font-semibold shadow-md"></div>
          </div>
        </div>
        <div class="absolute top-3 right-3 z-[500] flex flex-col gap-2">
          <button id="btn-locate" class="grid size-11 place-items-center rounded-full border-2 border-terre bg-sable text-indigo shadow-md" aria-label="Me localiser"></button>
          <a id="btn-share-map" href="#" target="_blank" rel="noopener" class="grid size-11 place-items-center rounded-full bg-sable shadow-md" aria-label="Partager la carte sur WhatsApp" title="Partager la carte sur WhatsApp"></a>
        </div>
      </main>

      <!-- Actions + Carnet de route -->
      <section class="parchment relative z-[1000] shrink-0 border-t-2 border-terre pb-[env(safe-area-inset-bottom)]">
        <div class="mx-auto grid max-w-3xl grid-cols-2 gap-2 px-3 pt-3">
          <button id="btn-report" class="btn-seal bg-ocre text-sm leading-tight text-white">
            <span class="size-[26px] shrink-0" data-icon="carRapide"></span><span data-i18n="cta.contribute"></span>
          </button>
          <button id="btn-alt" class="btn-seal bg-indigo text-sm leading-tight text-sable">
            <span class="size-[26px] shrink-0" data-icon="chest"></span><span data-i18n="cta.alternatives"></span>
          </button>
        </div>
        <button id="feed-toggle" class="mx-auto mt-2 flex w-full max-w-3xl items-center gap-2 px-4 pt-1" aria-expanded="false" aria-controls="feed">
          <span class="sheet-handle mx-auto absolute left-1/2 -translate-x-1/2 -mt-1"></span>
          <h2 class="font-display text-xl text-terre" data-i18n="feed.title"></h2>
          <span id="feed-count" class="rounded-full bg-terre px-2 text-xs font-bold text-sable"></span>
          <span class="ml-auto text-terre" aria-hidden="true" id="feed-chevron">▲</span>
        </button>
        <div id="feed" class="notebook-lines mx-auto h-[22dvh] max-w-3xl overflow-y-auto px-4 pb-2 transition-[height] duration-200" data-expanded="false">
          <ul id="feed-list" class="divide-y divide-terre/15 text-sm"></ul>
          <p id="data-freshness" class="mt-2 border-t border-terre/30 pt-2 text-xs leading-snug text-terre"></p>
        </div>
      </section>
    </div>

    <!-- Report dialog -->
    <dialog id="dlg-report" class="m-0 mt-auto w-full max-w-none bg-transparent p-0 backdrop:bg-ink/40 sm:m-auto sm:max-w-md">
      <div class="parchment rounded-t-3xl border-t-4 border-ocre p-5 pb-[max(1.25rem,env(safe-area-inset-bottom))] sm:rounded-3xl">
        <div class="mb-3 flex items-start justify-between gap-3">
          <h2 class="font-display text-2xl text-indigo" data-i18n="report.title"></h2>
          <button class="dlg-close grid size-10 shrink-0 place-items-center rounded-full text-terre" aria-label="Fermer"></button>
        </div>
        <p id="report-geo" class="mb-3 text-sm font-semibold text-terre" role="status"></p>
        <label id="report-landmark-wrap" class="mb-3 block text-sm font-semibold text-terre">
          <span data-i18n="report.landmark"></span>
          <input id="report-landmark" type="text" maxlength="120" autocomplete="off" class="mt-1 block w-full rounded-xl border-2 border-terre/50 bg-white/70 px-3 py-2.5 text-base text-ink outline-none focus:border-indigo" />
        </label>
        <div id="report-types" class="grid gap-3"></div>
        <div id="report-result" class="hidden"></div>
      </div>
    </dialog>

    <!-- Alternatives dialog -->
    <dialog id="dlg-alt" class="m-0 mt-auto max-h-[85dvh] w-full max-w-none bg-transparent p-0 backdrop:bg-ink/40 sm:m-auto sm:max-w-lg">
      <div class="parchment flex max-h-[85dvh] flex-col rounded-t-3xl border-t-4 border-indigo sm:rounded-3xl">
        <div class="flex items-start justify-between gap-3 p-5 pb-2">
          <h2 class="font-display text-2xl text-indigo" data-i18n="alternatives.title"></h2>
          <button class="dlg-close grid size-10 shrink-0 place-items-center rounded-full text-terre" aria-label="Fermer"></button>
        </div>
        <div id="alt-body" class="overflow-y-auto px-5 pb-[max(1.25rem,env(safe-area-inset-bottom))]"></div>
      </div>
    </dialog>

    <!-- Airport dialog -->
    <dialog id="dlg-airport" class="m-0 mt-auto max-h-[88dvh] w-full max-w-none bg-transparent p-0 backdrop:bg-ink/40 sm:m-auto sm:max-w-lg">
      <div class="parchment flex max-h-[88dvh] flex-col rounded-t-3xl border-t-4 border-indigo sm:rounded-3xl">
        <div class="flex items-start justify-between gap-3 p-5 pb-2">
          <h2 class="font-display text-2xl text-indigo" data-i18n="airport.title"></h2>
          <button class="dlg-close grid size-10 shrink-0 place-items-center rounded-full text-terre" aria-label="Fermer"></button>
        </div>
        <div id="airport-body" class="overflow-y-auto px-5 pb-[max(1.25rem,env(safe-area-inset-bottom))]"></div>
      </div>
    </dialog>

    <!-- Alerts dialog -->
    <dialog id="dlg-alerts" class="m-0 mt-auto max-h-[88dvh] w-full max-w-none bg-transparent p-0 backdrop:bg-ink/40 sm:m-auto sm:max-w-md">
      <div class="parchment flex max-h-[88dvh] flex-col rounded-t-3xl border-t-4 border-ocre sm:rounded-3xl">
        <div class="flex items-start justify-between gap-3 p-5 pb-2">
          <h2 class="font-display text-2xl text-indigo" data-i18n="alerts.title"></h2>
          <button class="dlg-close grid size-10 shrink-0 place-items-center rounded-full text-terre" aria-label="Fermer"></button>
        </div>
        <div id="alerts-body" class="overflow-y-auto px-5 pb-[max(1.25rem,env(safe-area-inset-bottom))]"></div>
      </div>
    </dialog>

    <!-- iOS install guide -->
    <dialog id="dlg-ios" class="m-0 mt-auto w-full max-w-none bg-transparent p-0 backdrop:bg-ink/40 sm:m-auto sm:max-w-md">
      <div class="parchment rounded-t-3xl border-t-4 border-indigo p-5 pb-[max(1.25rem,env(safe-area-inset-bottom))] sm:rounded-3xl">
        <h2 class="mb-3 font-display text-2xl text-indigo" data-i18n="install.iosTitle"></h2>
        <ol id="ios-steps" class="mb-4 list-decimal space-y-2 pl-5 text-[15px]"></ol>
        <button id="ios-later" class="btn-seal w-full border-2 border-terre bg-sable text-terre" data-i18n="install.later"></button>
      </div>
    </dialog>

    <!-- Menu dialog -->
    <dialog id="dlg-menu" class="m-0 ml-auto h-dvh max-h-none w-[min(22rem,90vw)] bg-transparent p-0 backdrop:bg-ink/40">
      <div class="parchment flex h-full flex-col gap-4 overflow-y-auto border-l-4 border-terre p-5">
        <div class="flex items-center justify-between">
          <h2 class="font-display text-2xl text-indigo" data-i18n="cta.menu"></h2>
          <button class="dlg-close grid size-10 place-items-center rounded-full text-terre" aria-label="Fermer"></button>
        </div>
        <div id="menu-body" class="flex flex-col gap-4 text-sm"></div>
      </div>
    </dialog>

    <div id="toasts" class="pointer-events-none fixed inset-x-0 bottom-36 z-[2000] flex flex-col items-center gap-2 px-4" aria-live="polite"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
